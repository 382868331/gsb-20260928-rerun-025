[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-robot-localization"
version = "0.1.0"
description = "Causal offline wheel/IMU robot localization core"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
include = ["robot_localization*"]

[project.scripts]
robot-localization-sample = "robot_localization.cli:main"
